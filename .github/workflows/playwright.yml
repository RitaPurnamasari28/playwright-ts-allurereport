name: Playwright Allure Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Makassar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run Test + Generate Allure
        run: npm test
        continue-on-error: true
      - name: Add Environment Properties to Allure
        if: always()
        run: |
          echo "Environment=Staging" >> allure-results/environment.properties
          echo "Base_URL=https://automationexercise.com/" >> allure-results/environment.properties
          echo "Browser=Chromium" >> allure-results/environment.properties
          echo "OS=${{ runner.os }}" >> allure-results/environment.properties
          echo "Node_Version=20" >> allure-results/environment.properties

      - name: Generate Allure Single File Report
        if: always()
        run: npx allure generate allure-results --clean --single-file

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          
      - name: Add Executor Info to Allure
        if: always()
        run: |
          cat <<EOF > allure-results/executor.json
          {
            "name": "GitHub Actions",
            "type": "github",
            "reportName": "Automation Test Report",
            "buildName": "Run #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }},
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF