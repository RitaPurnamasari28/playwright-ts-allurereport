name: Playwright Allure Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Tambahan izin agar otomatis bisa nge-push laporan ke branch gh-pages
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Makassar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run Test
        run: npm test
        continue-on-error: true

      - name: Add Environment Properties to Allure
        if: always()
        run: |
          echo "Environment=Staging" >> allure-results/environment.properties
          echo "OS=${{ runner.os }}" >> allure-results/environment.properties

      - name: Add Executor Info to Allure
        if: always()
        run: |
          cat <<EOF > allure-results/executor.json
          {
            "name": "GitHub Actions",
            "type": "github",
            "reportName": "Automation Test Report",
            "buildName": "Run #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }},
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy Allure history
        if: always()
        run: |
          mkdir -p allure-results/history
          cp -R gh-pages/history/* allure-results/history/ || true

      - name: Generate Allure Report
        if: always()
        run: npx allure generate allure-results --clean

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report